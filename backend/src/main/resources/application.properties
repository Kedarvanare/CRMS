# ============================================
# CRMS Backend - Spring Boot Configuration
# ============================================

# Server Port (8080 allows running side-by-side with Node.js on 3000, or switch to 3000 anytime)
server.port=8080

# MySQL DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/crms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Initialize data on startup
spring.sql.init.mode=never

# Jackson (JSON date formatting)
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging
logging.level.com.crms=INFO

# JWT Configuration
jwt.secret=crmsSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLongForHS256Algorithm
jwt.expiration-ms=86400000
